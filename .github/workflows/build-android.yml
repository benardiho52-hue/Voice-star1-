
name: Build VoiceStar Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build VoiceStar APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout VoiceStar source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check source files
        run: |
          set -e
          test -f app.js
          test -f features/Recording.js
          test -f lib/supabase.js
          node --check app.js

      - name: Generate Android project
        run: |
          npx --yes @react-native-community/cli@20.0.0 init VoiceStarNative --version 0.81.5 --skip-install --skip-git-init

      - name: Install dependencies
        working-directory: VoiceStarNative
        run: |
          npm install
          npm install @supabase/supabase-js react-native-url-polyfill react-native-audio-recorder-player@4.1.3 react-native-nitro-modules

      - name: Copy VoiceStar source
        run: |
          set -e
          cp app.js VoiceStarNative/App.js
          mkdir -p VoiceStarNative/features VoiceStarNative/services VoiceStarNative/lib
          cp features/Recording.js VoiceStarNative/features/Recording.js
          cp services/voiceStar.js VoiceStarNative/services/voiceStar.js
          cp lib/supabase.js VoiceStarNative/lib/supabase.js

      - name: Add microphone permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("VoiceStarNative/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if permission not in s:
              s = s.replace("<application", permission + "\n    <application", 1)
              p.write_text(s)
          PY

      - name: Build release APK
        working-directory: VoiceStarNative/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload VoiceStar APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceStar-Android-APK
          path: VoiceStarNative/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
