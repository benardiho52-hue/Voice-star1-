
name: Build VoiceStar Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VoiceStar source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Android native project
        run: |
          npx --yes @react-native-community/cli@20.0.0 init VoiceStarNative --version 0.81.5 --skip-install --skip-git-init

      - name: Add VoiceStar app screen
        run: |
          test -f app.js
          test -f VoiceStarNative/android/gradlew
          cp app.js VoiceStarNative/App.js

      - name: Install dependencies
        working-directory: VoiceStarNative
        run: npm install

      - name: Build release APK
        working-directory: VoiceStarNative/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload VoiceStar APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceStar-Android-APK
          path: VoiceStarNative/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
