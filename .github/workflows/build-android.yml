VoiceStar – Your Stage, Your Voice, Your Star Power! ⭐🎤

VoiceStar is a music and live-singing social app built for upcoming artists, singers, music lovers, and creative communities. Discover new talent, share your songs, perform live, connect with fans, and grow your music career.

⭐ Main Features

- Home & Discover: Explore songs, discover talented artists, and find new voices.
- Live Rooms: Host or join live singing sessions, connect with listeners, chat, and enjoy performances.
- Artist Studio: Create your music, record vocals, and enhance your sound with audio effects.
- Publish Songs: Upload your songs with cover images, titles, genres, descriptions, and hashtags.
- Artist Profiles: Showcase your music, followers, achievements, and personal artist identity.
- Social Community: Follow artists, interact with fans, share comments, and build friendships.
- Gifts & Rewards: Celebrate performers with virtual gifts, coins, achievements, and badges.
- Families & Teams: Build music communities, complete tasks, earn experience, and compete in family rankings.
- Notifications: Stay updated on new followers, messages, live rooms, and music activities.
- Safety & Moderation: Support a respectful community with reporting tools and appropriate content controls.

🎶 Our Mission

VoiceStar gives emerging artists a place to express themselves, develop their talents, share their creativity, and connect with a supportive music community.

Whether you sing, create music, or simply love discovering new talent, your journey starts here.

